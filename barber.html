<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Barber Pro">
<title>Barber Pro — Espace Coiffeur</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --black: #090909;
    --dark: #111111;
    --card: #181818;
    --border: #242424;
    --red: #e8382a;
    --red2: #c0281c;
    --gold: #d4a843;
    --text: #f0f0f0;
    --muted: #666;
    --sub: #999;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--black); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overscroll-behavior: none; }

  /* HEADER */
  .header { background: var(--dark); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  .header-logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 3px; color: var(--red); line-height: 1; }
  .header-sub { font-size: 10px; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-top: 1px; }
  .scan-fab { background: var(--red); color: #fff; border: none; border-radius: 12px; padding: 10px 18px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 7px; }

  /* NAV */
  .nav { display: flex; background: var(--dark); border-bottom: 1px solid var(--border); }
  .nav-btn { flex: 1; padding: 11px 4px; background: none; border: none; color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color 0.2s; }
  .nav-btn .icon { font-size: 19px; }
  .nav-btn.active { color: var(--red); border-bottom: 2px solid var(--red); }

  /* CONTENT */
  .content { padding: 16px; padding-bottom: 40px; max-width: 480px; margin: 0 auto; }

  /* STATS */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px 10px; text-align: center; }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 36px; color: var(--text); line-height: 1; }
  .stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
  .stat.red .stat-num { color: var(--red); }
  .stat.gold .stat-num { color: var(--gold); }

  /* SECTION TITLE */
  .section-title { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; margin-top: 4px; }

  /* REWARD ALERT */
  .reward-alert { background: #1a1200; border: 1px solid var(--gold); border-radius: 14px; padding: 14px; margin-bottom: 18px; }
  .reward-alert-title { font-size: 13px; font-weight: 700; color: var(--gold); margin-bottom: 10px; }
  .reward-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #2a1f00; }
  .reward-row:last-child { border-bottom: none; }
  .reward-use-btn { background: var(--gold); color: #000; border: none; border-radius: 8px; padding: 5px 12px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; }

  /* CLIENT ROW */
  .client-row { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 8px; transition: border-color 0.2s; }
  .client-row.reward { border-color: var(--gold); background: #130f00; }
  .avatar { width: 44px; height: 44px; border-radius: 12px; background: var(--red); display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: #fff; flex-shrink: 0; }
  .client-info { flex: 1; min-width: 0; }
  .client-name { font-size: 15px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .client-id { font-family: monospace; font-size: 11px; color: var(--red); margin-top: 2px; }
  .mini-bar { height: 4px; background: var(--border); border-radius: 99px; margin-top: 7px; overflow: hidden; }
  .mini-bar-fill { height: 100%; border-radius: 99px; transition: width 0.4s ease; }
  .client-right { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .cuts-badge { font-family: 'Bebas Neue', sans-serif; font-size: 18px; color: var(--red); line-height: 1; }
  .cuts-badge.gold { color: var(--gold); font-size: 20px; }
  .plus-btn { background: var(--red); color: #fff; border: none; border-radius: 8px; width: 36px; height: 28px; font-size: 18px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; font-family: 'DM Sans', sans-serif; }

  /* ADD FORM */
  .form-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; }
  .form-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 2px; margin-bottom: 18px; }
  .input-label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .input { width: 100%; background: var(--black); border: 1.5px solid var(--border); border-radius: 10px; padding: 12px 14px; color: var(--text); font-size: 15px; font-family: 'DM Sans', sans-serif; outline: none; margin-bottom: 14px; transition: border-color 0.2s; }
  .input:focus { border-color: var(--red); }
  .submit-btn { width: 100%; background: var(--red); color: #fff; border: none; border-radius: 10px; padding: 14px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-top: 4px; letter-spacing: 0.5px; }

  /* MODAL */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; align-items: flex-end; justify-content: center; z-index: 200; padding: 16px; }
  .overlay.center { align-items: center; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 20px 20px 16px 16px; padding: 24px; width: 100%; max-width: 440px; animation: slideUp 0.25s ease; }
  .overlay.center .modal { border-radius: 20px; animation: fadeScale 0.2s ease; }
  .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; margin-bottom: 6px; }
  .modal-name { font-size: 26px; font-weight: 800; margin-bottom: 14px; }
  .modal-cuts { text-align: center; color: var(--sub); font-size: 13px; margin: 8px 0; }
  .modal-reward { text-align: center; color: var(--gold); font-weight: 700; font-size: 15px; margin: 10px 0; }
  .modal-btns { display: flex; gap: 10px; margin-top: 18px; }
  .cancel-btn { flex: 1; background: var(--border); color: var(--text); border: none; border-radius: 10px; padding: 13px; font-size: 15px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 600; }
  .confirm-btn { flex: 2; background: #16a34a; color: #fff; border: none; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; }
  .close-btn { width: 100%; background: var(--border); color: var(--text); border: none; border-radius: 10px; padding: 13px; font-size: 15px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-weight: 600; margin-top: 12px; }

  /* PROGRESS BAR */
  .prog-bar { background: var(--border); border-radius: 99px; height: 8px; overflow: hidden; margin: 10px 0 4px; }
  .prog-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; }
  .prog-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

  /* SCANNER */
  .scanner-wrap { background: var(--black); border-radius: 16px; overflow: hidden; margin-bottom: 16px; }
  #qr-reader { width: 100% !important; }
  #qr-reader video { border-radius: 16px; }
  #qr-reader__scan_region { border-radius: 16px; }

  /* SHARE MODAL */
  .share-card { background: var(--black); border-radius: 14px; padding: 16px; margin: 12px 0; border: 1px solid var(--border); }
  .share-link { font-family: monospace; font-size: 12px; color: var(--red); word-break: break-all; margin-bottom: 10px; line-height: 1.5; }
  .share-btn { width: 100%; background: #25d366; color: #fff; border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: 'DM Sans', sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .copy-btn { width: 100%; background: var(--border); color: var(--text); border: none; border-radius: 10px; padding: 11px; font-size: 13px; cursor: pointer; font-family: 'DM Sans', sans-serif; margin-top: 8px; font-weight: 600; }
  #qr-preview { display: flex; justify-content: center; margin: 10px 0; }

  /* TOAST */
  .toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 11px 20px; border-radius: 12px; color: #fff; font-weight: 700; font-size: 13px; z-index: 9999; white-space: nowrap; box-shadow: 0 4px 24px rgba(0,0,0,0.6); animation: slideDown 0.3s ease; pointer-events: none; }

  /* ANIMATIONS */
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes fadeScale { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes slideDown { from { transform: translate(-50%, -16px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .fade-in { animation: fadeIn 0.3s ease; }

  .empty { text-align: center; color: var(--muted); padding: 32px 16px; font-size: 14px; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header-logo">✂ BARBER PRO</div>
    <div class="header-sub">Espace Coiffeur</div>
  </div>
  <button class="scan-fab" onclick="openScanner()">
    <span>📷</span> Scanner
  </button>
</div>

<div class="nav">
  <button class="nav-btn active" id="nav-home" onclick="showTab('home')">
    <span class="icon">🏠</span>Accueil
  </button>
  <button class="nav-btn" id="nav-clients" onclick="showTab('clients')">
    <span class="icon">👥</span>Clients
  </button>
  <button class="nav-btn" id="nav-add" onclick="showTab('add')">
    <span class="icon">➕</span>Ajouter
  </button>
</div>

<div class="content" id="tab-home">
  <div id="stats-row" class="stats"></div>
  <div id="reward-section"></div>
  <div class="section-title">Clients récents</div>
  <div id="recent-list"></div>
</div>

<div class="content" id="tab-clients" style="display:none">
  <div class="section-title" id="clients-title"></div>
  <div id="all-clients-list"></div>
</div>

<div class="content" id="tab-add" style="display:none">
  <div class="form-card">
    <div class="form-title">NOUVEAU CLIENT</div>
    <label class="input-label">Nom complet</label>
    <input class="input" id="new-name" placeholder="Ex: Mohamed Amine" type="text" autocomplete="off">
    <label class="input-label">Téléphone (optionnel)</label>
    <input class="input" id="new-phone" placeholder="Ex: 06 12 34 56 78" type="tel" autocomplete="off">
    <button class="submit-btn" onclick="addClient()">Créer la carte de fidélité</button>
  </div>
</div>

<!-- Scanner Modal -->
<div class="overlay" id="scanner-modal" style="display:none">
  <div class="modal">
    <div class="modal-title">SCANNER UN CLIENT</div>
    <p style="color:var(--muted);font-size:13px;margin-bottom:14px">Pointez la caméra vers le QR code du client</p>
    <div class="scanner-wrap">
      <div id="qr-reader"></div>
    </div>
    <button class="close-btn" onclick="closeScanner()">Fermer</button>
  </div>
</div>

<!-- Confirm Modal -->
<div class="overlay center" id="confirm-modal" style="display:none">
  <div class="modal">
    <div class="modal-title">VALIDER UNE COUPE ?</div>
    <div class="modal-name" id="confirm-name"></div>
    <div id="confirm-progress"></div>
    <div class="modal-cuts" id="confirm-cuts"></div>
    <div class="modal-reward" id="confirm-reward" style="display:none"></div>
    <div class="modal-btns">
      <button class="cancel-btn" onclick="closeConfirm()">Annuler</button>
      <button class="confirm-btn" onclick="doValidate()">✅ Confirmer</button>
    </div>
  </div>
</div>

<!-- Share Modal -->
<div class="overlay center" id="share-modal" style="display:none">
  <div class="modal">
    <div class="modal-title">PARTAGER LA CARTE</div>
    <div class="modal-name" id="share-name"></div>
    <div id="qr-preview"></div>
    <div class="share-card">
      <div class="share-link" id="share-link-text"></div>
      <button class="share-btn" onclick="shareWhatsApp()">
        <span>💬</span> Envoyer par WhatsApp
      </button>
      <button class="copy-btn" onclick="copyLink()">📋 Copier le lien</button>
    </div>
    <button class="close-btn" onclick="document.getElementById('share-modal').style.display='none'">Fermer</button>
  </div>
</div>

<div id="toast" class="toast" style="display:none"></div>

<script>
// ── DATA ──────────────────────────────────────────────────────────
const BASE_URL = window.location.origin + window.location.pathname.replace('barber.html','') + 'client.html';

function loadClients() {
  try { return JSON.parse(localStorage.getItem('barber_clients') || '[]'); } catch { return []; }
}
function saveClients(c) {
  localStorage.setItem('barber_clients', JSON.stringify(c));
}
function genId() {
  return 'C' + Date.now().toString(36).toUpperCase().slice(-4);
}

let currentConfirmId = null;
let currentShareId = null;
let html5QrCode = null;

// ── TABS ──────────────────────────────────────────────────────────
function showTab(tab) {
  ['home','clients','add'].forEach(t => {
    document.getElementById('tab-' + t).style.display = t === tab ? 'block' : 'none';
    document.getElementById('nav-' + t).classList.toggle('active', t === tab);
  });
  if (tab === 'home') renderHome();
  if (tab === 'clients') renderClients();
}

// ── RENDER HOME ───────────────────────────────────────────────────
function renderHome() {
  const clients = loadClients();
  const total = clients.reduce((s,c) => s + c.cuts, 0);
  const rewards = clients.filter(c => c.cuts >= 10);

  document.getElementById('stats-row').innerHTML = `
    <div class="stat"><div class="stat-num">${clients.length}</div><div class="stat-label">Clients</div></div>
    <div class="stat red"><div class="stat-num">${total}</div><div class="stat-label">Coupes</div></div>
    <div class="stat gold"><div class="stat-num">${rewards.length}</div><div class="stat-label">Réductions</div></div>
  `;

  let rewardHTML = '';
  if (rewards.length > 0) {
    rewardHTML = `<div class="reward-alert">
      <div class="reward-alert-title">🎁 Réductions -50% disponibles</div>
      ${rewards.map(c => `
        <div class="reward-row">
          <span style="font-weight:600">${c.name}</span>
          <button class="reward-use-btn" onclick="useReward('${c.id}')">Utiliser -50%</button>
        </div>`).join('')}
    </div>`;
  }
  document.getElementById('reward-section').innerHTML = rewardHTML;

  const recent = [...clients].reverse().slice(0, 5);
  document.getElementById('recent-list').innerHTML = recent.length
    ? recent.map(c => clientRowHTML(c)).join('')
    : '<div class="empty">Aucun client encore.<br>Ajoutez votre premier client !</div>';
}

function renderClients() {
  const clients = loadClients();
  document.getElementById('clients-title').textContent = clients.length + ' client' + (clients.length > 1 ? 's' : '');
  document.getElementById('all-clients-list').innerHTML = clients.length
    ? clients.map(c => clientRowHTML(c, true)).join('')
    : '<div class="empty">Aucun client encore.</div>';
}

function clientRowHTML(c, showShare = false) {
  const pct = Math.min(100, (c.cuts / 10) * 100);
  const hasReward = c.cuts >= 10;
  const fillColor = hasReward ? 'var(--gold)' : 'var(--red)';
  return `
    <div class="client-row ${hasReward ? 'reward' : ''} fade-in">
      <div class="avatar">${c.name[0].toUpperCase()}</div>
      <div class="client-info">
        <div class="client-name">${c.name}</div>
        <div class="client-id">${c.id}</div>
        <div class="mini-bar"><div class="mini-bar-fill" style="width:${pct}%;background:${fillColor}"></div></div>
      </div>
      <div class="client-right">
        <div class="cuts-badge ${hasReward ? 'gold' : ''}">${hasReward ? '🎁' : c.cuts + '/10'}</div>
        <button class="plus-btn" onclick="openConfirm('${c.id}')">+1</button>
        ${showShare ? `<button onclick="openShare('${c.id}')" style="background:none;border:none;cursor:pointer;font-size:18px;margin-top:2px">📤</button>` : ''}
      </div>
    </div>`;
}

// ── ADD CLIENT ────────────────────────────────────────────────────
function addClient() {
  const name = document.getElementById('new-name').value.trim();
  const phone = document.getElementById('new-phone').value.trim();
  if (!name) { showToast('⚠️ Entrez un nom', 'error'); return; }
  const clients = loadClients();
  const id = genId();
  clients.push({ id, name, phone, cuts: 0, joinDate: new Date().toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' }) });
  saveClients(clients);
  document.getElementById('new-name').value = '';
  document.getElementById('new-phone').value = '';
  showToast('✅ ' + name + ' ajouté !');
  showTab('clients');
}

// ── CONFIRM VALIDATE ──────────────────────────────────────────────
function openConfirm(id) {
  const clients = loadClients();
  const c = clients.find(x => x.id === id);
  if (!c) return;
  currentConfirmId = id;
  document.getElementById('confirm-name').textContent = c.name;
  const next = c.cuts + 1;
  document.getElementById('confirm-progress').innerHTML = progressHTML(c.cuts);
  document.getElementById('confirm-cuts').textContent = next + '/10 après validation';
  const rewardEl = document.getElementById('confirm-reward');
  if (next >= 10) { rewardEl.textContent = '🎉 Débloque la réduction -50% !'; rewardEl.style.display = 'block'; }
  else rewardEl.style.display = 'none';
  document.getElementById('confirm-modal').style.display = 'flex';
}
function closeConfirm() {
  document.getElementById('confirm-modal').style.display = 'none';
  currentConfirmId = null;
}
function doValidate() {
  if (!currentConfirmId) return;
  const clients = loadClients();
  const idx = clients.findIndex(x => x.id === currentConfirmId);
  if (idx === -1) return;
  clients[idx].cuts += 1;
  const name = clients[idx].name;
  const cuts = clients[idx].cuts;
  saveClients(clients);
  closeConfirm();
  if (cuts >= 10) showToast('🎉 ' + name + ' a droit à -50% !', 'gold');
  else showToast('✂️ Coupe validée pour ' + name + ' (' + cuts + '/10)');
  renderHome();
}

function useReward(id) {
  const clients = loadClients();
  const idx = clients.findIndex(x => x.id === id);
  if (idx === -1) return;
  const name = clients[idx].name;
  clients[idx].cuts = 0;
  saveClients(clients);
  showToast('🎁 Réduction utilisée — ' + name + ' repart de 0 !', 'gold');
  renderHome();
}

// ── SCANNER ───────────────────────────────────────────────────────
function openScanner() {
  document.getElementById('scanner-modal').style.display = 'flex';
  setTimeout(() => {
    html5QrCode = new Html5Qrcode('qr-reader');
    html5QrCode.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      (decodedText) => {
        closeScanner();
        // decodedText = client ID
        const clients = loadClients();
        const c = clients.find(x => x.id === decodedText);
        if (c) openConfirm(c.id);
        else showToast('❌ Client introuvable', 'error');
      },
      () => {}
    ).catch(() => showToast('❌ Caméra inaccessible', 'error'));
  }, 100);
}
function closeScanner() {
  if (html5QrCode) {
    html5QrCode.stop().catch(() => {});
    html5QrCode = null;
  }
  document.getElementById('scanner-modal').style.display = 'none';
  document.getElementById('qr-reader').innerHTML = '';
}

// ── SHARE ─────────────────────────────────────────────────────────
function openShare(id) {
  const clients = loadClients();
  const c = clients.find(x => x.id === id);
  if (!c) return;
  currentShareId = id;
  document.getElementById('share-name').textContent = c.name;
  const link = BASE_URL + '?id=' + id;
  document.getElementById('share-link-text').textContent = link;

  // Generate QR
  const qrDiv = document.getElementById('qr-preview');
  qrDiv.innerHTML = '';
  const inner = document.createElement('div');
  qrDiv.appendChild(inner);
  new QRCode(inner, { text: id, width: 140, height: 140, colorDark: '#e8382a', colorLight: '#181818' });

  document.getElementById('share-modal').style.display = 'flex';
}
function shareWhatsApp() {
  const clients = loadClients();
  const c = clients.find(x => x.id === currentShareId);
  if (!c) return;
  const link = BASE_URL + '?id=' + c.id;
  const msg = `✂️ Voici ta carte de fidélité !\n\nNom : ${c.name}\nCode : ${c.id}\n\n👉 ${link}\n\nMets ce lien en favori pour suivre tes coupes 💈`;
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}
function copyLink() {
  const clients = loadClients();
  const c = clients.find(x => x.id === currentShareId);
  if (!c) return;
  const link = BASE_URL + '?id=' + c.id;
  navigator.clipboard.writeText(link).then(() => showToast('📋 Lien copié !')).catch(() => {
    const ta = document.createElement('textarea');
    ta.value = link; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    showToast('📋 Lien copié !');
  });
}

// ── HELPERS ───────────────────────────────────────────────────────
function progressHTML(cuts) {
  const pct = Math.min(100, (cuts / 10) * 100);
  const color = cuts >= 10 ? 'var(--gold)' : 'var(--red)';
  return `<div class="prog-bar"><div class="prog-fill" style="width:${pct}%;background:${color}"></div></div>
          <div class="prog-labels"><span>${cuts}/10</span><span>${cuts >= 10 ? '🎁 -50%' : (10-cuts) + ' restantes'}</span></div>`;
}

function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = type === 'error' ? '#dc2626' : type === 'gold' ? '#d4a843' : '#16a34a';
  t.style.color = type === 'gold' ? '#000' : '#fff';
  t.style.display = 'block';
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.style.display = 'none', 3000);
}

// ── INIT ──────────────────────────────────────────────────────────
renderHome();
</script>
</body>
</html>
